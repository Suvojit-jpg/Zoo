<script>

    /*
     * CLICKABLE ANIMALS
     */

    const animals = document.querySelectorAll(".animal");

    const animalInfo =
        document.getElementById("animalInfo");

    const animalName =
        document.getElementById("animalName");

    const animalDescription =
        document.getElementById("animalDescription");


    animals.forEach(animal => {

        animal.addEventListener("click", () => {

            animalName.textContent =
                animal.dataset.name;

            animalDescription.textContent =
                animal.dataset.description;

            animalInfo.style.display = "block";

            setTimeout(() => {
                animalInfo.style.display = "none";
            }, 5000);

        });

    });

</script>
